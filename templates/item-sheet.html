<form class="flexcol">
  <header class="sheet-header flexrow">
    <h1><input name="name" type="text" value="{{item.name}}" placeholder="Item Name"/></h1>
  </header>

  <section class="sheet-body">

    {{#if isSkill}}
      <div class="form-group">
        <label>Stat</label>
        {{#if isCustom}}
          <select name="system.stat">
            {{#each statOptions as |opt|}}
              <option value="{{opt.value}}" {{#if opt.selected}}selected{{/if}}>{{opt.label}}</option>
            {{/each}}
          </select>
        {{else}}
          <input type="text" value="{{system.stat}}" readonly style="background: #f0f0f0;"/>
          <small style="color: #666; font-style: italic;">Default skills use fixed stats. Only custom skills can be edited.</small>
        {{/if}}
      </div>
    {{/if}}

    {{#if isCyberware}}
      <div class="form-group">
        <label>Slot</label>
        <input type="text" name="system.slot" value="{{system.slot}}" placeholder="head, torso, lArm, rArm, lLeg, rLeg"/>
      </div>

      <div class="form-group">
        <label>Spaces</label>
        <input type="number" name="system.spaces" value="{{system.spaces}}" min="0"/>
      </div>

      <div class="form-group">
        <label>Humanity Loss</label>
        <input type="number" name="system.humanityLoss" value="{{system.humanityLoss}}" min="0"/>
      </div>

      <div class="form-group">
        <label>Cost (eb)</label>
        <input type="number" name="system.cost" value="{{system.cost}}" min="0"/>
      </div>

      <div class="form-group">
        <label>Armor</label>
        <input type="number" name="system.armor" value="{{system.armor}}" min="0"/>
      </div>

      <div class="form-group">
        <label>Integrity</label>
        <input type="number" name="system.integrity" value="{{system.integrity}}" min="0"/>
      </div>

      <div class="form-group stacked">
        <label>Description</label>
        <textarea name="system.description" rows="4" placeholder="What this cyberware does">{{system.description}}</textarea>
      </div>

      <div class="form-group stacked">
        <label>Notes</label>
        <textarea name="system.note" rows="2" placeholder="Extra details">{{system.note}}</textarea>
      </div>
    {{/if}}

  </section>
</form>
